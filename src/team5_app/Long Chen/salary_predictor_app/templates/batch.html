{% extends "base.html" %}
{% block title %}Batch Salary Prediction{% endblock %}

{% block content %}
<div class="desk-header">
  <h1>Batch prediction</h1>
  <p>Upload a CSV with the same columns as the single-record form.</p>
</div>

<form id="batch-form" class="ledger-form" enctype="multipart/form-data">
  <input type="file" name="file" accept=".csv" required style="margin-bottom:1rem;" />
  <button type="submit" class="button button--primary">Upload &amp; predict</button>
</form>

<div id="batch-result" style="margin-top:1.5rem;"></div>

<script>
const BATCH_URL = window.location.pathname.replace(/\/$/, "");

document.getElementById("batch-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);
  const out = document.getElementById("batch-result");

  try {
    const res = await fetch(`${BATCH_URL}/predict`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!res.ok) {
      out.innerHTML = `<p style="color:var(--danger)">${data.error || "Batch prediction failed."}</p>`;
      return;
    }

    const downloadUrl = `${BATCH_URL}/download/${data.result_id}`;

    out.innerHTML = `
      <p>${data.row_count} rows predicted.</p>
      <a class="button button--primary" href="${downloadUrl}">
        Download full results
      </a>
    `;
  } catch (err) {
    out.innerHTML = `
      <p style="color:var(--danger)">
        Could not reach the batch prediction server.
      </p>
    `;
    console.error(err);
  }
});
</script>
{% endblock %}
