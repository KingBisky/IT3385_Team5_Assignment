[tool.poetry]
name = "IT3385_Team5_Assignment"
version = "0.1.0"
description = ""
authors = ["Team 5"]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"

# MLOps / project tooling
dvc = "^2.10.0"
hydra-core = "^1.1.1"
pdoc3 = "^0.10.0"

# Integrated Flask ML application
flask = "3.0.3"
pycaret = "3.3.2"
pandas = "2.1.4"
numpy = "1.26.4"
scikit-learn = "1.4.2"
category-encoders = "2.6.3"

pathspec = "0.11.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
pre-commit = "^2.17.0"
ipykernel = "^6.28.0"

matplotlib = "*"
seaborn = "*"
scipy = "*"
jupyterlab = "*"
notebook = "*"

mlflow = "1.27.0"
protobuf = "3.20.3"
setuptools = "80.10.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
ignore = ["E501"]
select = ["B","C","E","F","W","B9", "I", "Q"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

[tool.ruff.mccabe]
max-complexity = 10
